<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#212121">
<title>Nakata</title>
<style>
:root{
  --bg:#212121; --bar:#2f2f2f; --userbubble:#303030; --drawer:#171717;
  --ink:#ececec; --muted:#9b9b9b; --line:#3a3a3a; --accent:#ececec;
  --send:#ffffff; --sendink:#000; --err:#f4756b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}

/* top bar */
header{display:flex;align-items:center;gap:4px;height:48px;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;flex:none}
header .icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
header .icon:active{background:#ffffff14}
header .model{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:17px;font-weight:600;color:var(--ink);background:none;border:0;min-width:0}
header .model span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .model:active{opacity:.6}
header .model svg{width:16px;height:16px;opacity:.6;flex:none}

/* bot picker sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--drawer);border-radius:18px 18px 0 0;transform:translateY(100%);transition:transform .22s ease;max-height:70dvh;display:flex;flex-direction:column;padding-bottom:calc(env(safe-area-inset-bottom) + 8px)}
.sheet.on{transform:none}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:#ffffff33;margin:8px auto 2px}
.sheet-title{padding:6px 18px 8px;color:var(--muted);font-size:13px;font-weight:600}
.sheet-list{overflow-y:auto;padding:0 8px 6px}
.botopt{display:flex;align-items:center;gap:2px;border-radius:12px}
.botmain{flex:1;display:flex;align-items:center;gap:12px;text-align:left;padding:12px 12px;border-radius:12px;min-width:0}
.botmain:active{background:#ffffff14}
.botopt .av{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.botopt .av svg{width:18px;height:18px}
.botopt .meta{min-width:0;flex:1}
.botopt .nm{font-weight:600}
.botopt .ds{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.botopt .chk{color:var(--ink);opacity:0}
.botopt.on .chk{opacity:1}
.botopt .edit{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.botopt .edit:active{background:#ffffff1a}
.botopt .edit svg{width:16px;height:16px}
.botnew{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:4px 8px 6px;padding:12px;border:1px dashed var(--line);border-radius:12px;color:var(--ink)}
.botnew svg{width:18px;height:18px}
.form{max-width:640px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:6px;width:100%}
.form label{color:var(--muted);font-size:13px;margin-top:10px}
.form .hint{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.4}
.form .hint a{color:#7aa2ff;text-decoration:none}
.field{background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;outline:none;width:100%;box-sizing:border-box}
select.field{appearance:none;-webkit-appearance:none}
.field.area{resize:vertical;min-height:140px;line-height:1.45}
.keyrow{display:flex;gap:6px}
.keyrow .field{flex:1}
.keyrow button{flex:none;width:46px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.del{margin-top:22px;background:none;border:1px solid var(--err);color:var(--err);border-radius:12px;padding:12px;font:inherit}
.del[hidden]{display:none}
.primary{margin-top:18px;background:var(--send);color:var(--sendink);border-radius:14px;padding:14px;font:600 16px/1 inherit}
.primary[disabled]{background:#ffffff26;color:#ffffff66}

/* views */
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* chat */
#thread{max-width:780px;width:100%;margin:0 auto;padding:8px 14px 10px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-direction:column}
.row.user{align-items:flex-end}
.bubble{max-width:85%;background:var(--userbubble);border-radius:22px;padding:10px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.asst{display:flex;gap:11px;align-items:flex-start}
.asst .logo{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-top:1px}
.asst .logo svg{width:16px;height:16px}
.asst .text{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:2px}
.reason{align-self:flex-start;max-width:100%;color:var(--muted);font:13px/1.45 -apple-system,system-ui,sans-serif;border-left:2px solid var(--line);padding:1px 0 1px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.note{align-self:center;color:var(--muted);font-size:13px;text-align:center}
.note.err{color:var(--err)}

/* empty chat hero */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink);padding:24px}
.hero[hidden]{display:none}
.hero .mark{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.hero .mark svg{width:26px;height:26px}
.hero h2{font-size:22px;font-weight:600;margin:0}

/* composer */
.composer-wrap{flex:none;padding:6px 12px calc(env(safe-area-inset-bottom) + 8px)}
form.composer{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--bar);border-radius:26px;padding:6px}
form.composer .plus{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
form.composer .plus:active{background:#ffffff14}
form.composer textarea{flex:1;resize:none;max-height:150px;background:none;border:0;color:var(--ink);padding:9px 4px;font:inherit;line-height:1.4;outline:none}
form.composer textarea::placeholder{color:var(--muted)}
form.composer .act{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--send);color:var(--sendink)}
form.composer .act[disabled]{background:#ffffff26;color:#ffffff66}

/* drawer */
.scrim{position:fixed;inset:0;background:#0008;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:340px;background:var(--drawer);z-index:50;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.drawer.on{transform:none}
.drawer .dhead{padding:12px 14px 6px}
.drawer .search{display:flex;align-items:center;gap:8px;background:#ffffff12;border-radius:12px;padding:9px 12px;color:var(--muted)}
.drawer .search input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit}
.drawer .newrow{display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:500}
.drawer .newrow svg{width:20px;height:20px}
.drawer .slist{flex:1;overflow-y:auto;padding:4px 8px}
.drawer .sec{color:var(--muted);font-size:12px;font-weight:600;padding:12px 10px 4px}
.drawer .sitem{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:10px 10px;border-radius:10px}
.drawer .sitem .st{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer .sitem:active,.drawer .sitem.on{background:#ffffff14}
.drawer .sitem .x{flex:none;width:26px;height:26px;border-radius:50%;color:var(--muted);opacity:0}
.drawer .sitem.on .x{opacity:1}
.drawer .sitem .x svg{width:15px;height:15px;margin:auto}
.drawer .tools{border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 8px)}
.drawer .trow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;border-radius:10px}
.drawer .trow:active{background:#ffffff14}
.drawer .trow svg{width:20px;height:20px;opacity:.85}

/* feature overlays */
.feature{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.feature.on{transform:none}
.feature header .model{justify-content:flex-start;font-weight:600;padding-left:4px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px;text-align:center}
.linkbtn{display:inline-block;background:var(--userbubble);color:var(--ink);border-radius:14px;padding:14px 22px;font-weight:600;text-decoration:none}
.muted{color:var(--muted)}
</style>
</head>
<body>

<!-- CHAT -->
<header>
  <button class="icon" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="model" id="modelBtn"><span id="modelName">Nakata</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="icon" id="newBtn" aria-label="Yeni sohbet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
</header>

<div class="view" id="chatView">
  <div class="scroll" id="chatScroll">
    <div class="hero" id="hero">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div>
      <h2>Ne lazım?</h2>
    </div>
    <div id="thread" hidden></div>
  </div>
  <div class="composer-wrap">
    <form class="composer" id="composer">
      <button type="button" class="plus" id="plusBtn" aria-label="Ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="prompt" rows="1" placeholder="Mesaj yaz" enterkeyhint="send"></textarea>
      <button type="submit" class="act" id="sendBtn" aria-label="Gönder" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </div>
</div>

<!-- BOT PICKER -->
<div class="sheet" id="botSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-title">Bot seç</div>
  <div class="sheet-list" id="botList"></div>
  <button class="botnew" id="botNew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Yeni bot</button>
</div>

<!-- BOT FORM -->
<section class="feature" id="f-botform">
  <header>
    <button class="icon fclose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="model" id="botFormTitle">Yeni bot</div>
    <button class="icon" id="botSave" aria-label="Kaydet" style="color:var(--send);font-weight:600;font-size:15px;width:auto;padding:0 10px">Kaydet</button>
  </header>
  <div class="scroll"><div class="form">
    <label>İsim</label>
    <input id="bf-name" class="field" placeholder="örn. Scout" autocomplete="off" autocapitalize="words">
    <label>Model <span class="muted">(opsiyonel — boşsa varsayılan model)</span></label>
    <input id="bf-model" class="field" placeholder="örn. anthropic/claude-sonnet-4" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>Persona / talimat</label>
    <textarea id="bf-persona" class="field area" rows="8" placeholder="Bu bot kim? Nasıl cevap versin?"></textarea>
    <button class="del" id="bf-del" hidden>Botu sil</button>
  </div></div>
</section>

<!-- SETTINGS (BYOK) -->
<section class="feature" id="f-settings">
  <header>
    <button class="icon fclose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="model">Ayarlar</div>
    <span style="width:40px"></span>
  </header>
  <div class="scroll"><div class="form">
    <label>Sağlayıcı</label>
    <select id="st-provider" class="field">
      <option value="openrouter">OpenRouter — tek anahtar, tüm modeller (önerilen)</option>
      <option value="openai">OpenAI</option>
      <option value="groq">Groq</option>
      <option value="deepseek">DeepSeek</option>
      <option value="gemini">Google Gemini</option>
      <option value="custom">Özel (base URL gir)</option>
    </select>
    <label>API adresi</label>
    <input id="st-base" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
    <label>API anahtarı</label>
    <div class="keyrow">
      <input id="st-key" class="field" type="password" placeholder="sk-..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="st-eye" aria-label="Göster"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="hint">Anahtar yalnızca bu cihazda saklanır, hiçbir sunucuya gönderilmez. <span id="st-getkey"></span></div>
    <label>Model</label>
    <input id="st-model" class="field" placeholder="örn. openai/gpt-4o-mini" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint" id="st-modelhint"></div>
    <button class="primary" id="st-save">Kaydet</button>
  </div></div>
</section>

<!-- DRAWER -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <div class="dhead">
    <div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><input id="search" placeholder="Ara" autocomplete="off"></div>
  </div>
  <button class="newrow" id="newBtn2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> Yeni sohbet</button>
  <div class="slist" id="slist"></div>
  <div class="tools">
    <button class="trow" data-feature="image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg> Görsel üret</button>
    <button class="trow" id="settingsRow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Ayarlar</button>
  </div>
</aside>

<!-- FEATURE: image -->
<section class="feature" id="f-image">
  <header><button class="icon fclose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="model">Görsel</div><span style="width:40px"></span></header>
  <div class="center"><p class="muted">Görsel stüdyosu nakata.app'te açılır.</p><a class="linkbtn" href="https://nakata.app/" target="_blank" rel="noopener">Görsel stüdyosunu aç</a></div>
</section>

<script>
const $ = (s) => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const ASST_LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>';

/* ---- storage (device-only; native build swaps key to Keychain) ---- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
};

/* ---- provider presets ---- */
const PROVIDERS = {
  openrouter:{ base:"https://openrouter.ai/api/v1", model:"openai/gpt-4o-mini",
               keyUrl:"https://openrouter.ai/keys", hint:"Model: openai/gpt-4o-mini, anthropic/claude-sonnet-4, google/gemini-2.5-flash … (tam liste openrouter.ai/models)" },
  openai:{ base:"https://api.openai.com/v1", model:"gpt-4o-mini",
           keyUrl:"https://platform.openai.com/api-keys", hint:"Model: gpt-4o-mini, gpt-4o, o4-mini …" },
  groq:{ base:"https://api.groq.com/openai/v1", model:"llama-3.3-70b-versatile",
         keyUrl:"https://console.groq.com/keys", hint:"Model: llama-3.3-70b-versatile, moonshotai/kimi-k2-instruct …" },
  deepseek:{ base:"https://api.deepseek.com/v1", model:"deepseek-chat",
             keyUrl:"https://platform.deepseek.com/api_keys", hint:"Model: deepseek-chat, deepseek-reasoner" },
  gemini:{ base:"https://generativelanguage.googleapis.com/v1beta/openai", model:"gemini-2.5-flash",
           keyUrl:"https://aistudio.google.com/apikey", hint:"Model: gemini-2.5-flash, gemini-2.5-pro" },
  custom:{ base:"", model:"", keyUrl:"", hint:"OpenAI-uyumlu herhangi bir sağlayıcı (base URL …/v1)" },
};
function getCfg(){ return LS.get("nakata_byok_cfg", { provider:"openrouter", base:PROVIDERS.openrouter.base, model:PROVIDERS.openrouter.model, key:"" }); }
function saveCfg(c){ LS.set("nakata_byok_cfg", c); }

/* ---- drawer ---- */
function openDrawer(){ $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#menuBtn").addEventListener("click", () => { openDrawer(); renderSessions($("#search").value); });
$("#scrim").addEventListener("click", () => { closeDrawer(); $("#botSheet").classList.remove("on"); });

/* ---- features ---- */
function openFeature(name){ closeDrawer(); $(`#f-${name}`).classList.add("on"); }
for (const b of document.querySelectorAll(".drawer .trow[data-feature]")) b.addEventListener("click", () => openFeature(b.dataset.feature));
for (const b of document.querySelectorAll(".fclose")) b.addEventListener("click", () => b.closest(".feature").classList.remove("on"));

/* ---- settings ---- */
function fillProviderUI(p){
  const pr = PROVIDERS[p] || PROVIDERS.custom;
  $("#st-base").value = pr.base; $("#st-base").readOnly = (p !== "custom");
  $("#st-model").placeholder = pr.model || "model-adı";
  $("#st-modelhint").textContent = pr.hint || "";
  $("#st-getkey").innerHTML = pr.keyUrl ? `Anahtarı al: <a href="${pr.keyUrl}" target="_blank" rel="noopener">${pr.keyUrl.replace(/^https?:\/\//,"")}</a>` : "";
}
function openSettings(){
  const c = getCfg();
  $("#st-provider").value = c.provider; fillProviderUI(c.provider);
  $("#st-base").value = c.base || (PROVIDERS[c.provider]||{}).base || "";
  $("#st-key").value = c.key || ""; $("#st-model").value = c.model || "";
  closeDrawer(); $("#f-settings").classList.add("on");
}
$("#settingsRow").addEventListener("click", openSettings);
$("#st-provider").addEventListener("change", (e) => {
  const p = e.target.value, pr = PROVIDERS[p] || PROVIDERS.custom;
  fillProviderUI(p);
  if (p !== "custom") { $("#st-base").value = pr.base; if (!$("#st-model").value) $("#st-model").value = pr.model; }
});
$("#st-eye").addEventListener("click", () => { const f = $("#st-key"); f.type = f.type === "password" ? "text" : "password"; });
$("#st-save").addEventListener("click", () => {
  const provider = $("#st-provider").value;
  const base = $("#st-base").value.trim().replace(/\/+$/,"");
  const key = $("#st-key").value.trim();
  const model = $("#st-model").value.trim() || (PROVIDERS[provider]||{}).model || "";
  if (!base) return $("#st-base").focus();
  if (!key) return $("#st-key").focus();
  if (!model) return $("#st-model").focus();
  saveCfg({ provider, base, model, key });
  setModelLabel();
  $("#f-settings").classList.remove("on");
});

/* ---- bots (local personas) ---- */
function allBots(){ return LS.get("nakata_byok_bots", {}); }
function saveBots(b){ LS.set("nakata_byok_bots", b); }
let activeBot = null;
function setModelLabel(){ $("#modelName").textContent = activeBot || "Nakata"; }
function closeSheet(){ $("#botSheet").classList.remove("on"); if (!$("#drawer").classList.contains("on")) $("#scrim").classList.remove("on"); }
function openBotSheet(){
  $("#scrim").classList.add("on"); $("#botSheet").classList.add("on");
  const list = $("#botList"); list.replaceChildren();
  const bots = allBots();
  const mk = (name, desc, on, isBot) => {
    const row = el("div", "botopt" + (on ? " on" : ""));
    const main = el("button", "botmain");
    const av = el("div", "av"); av.innerHTML = ASST_LOGO;
    const meta = el("div", "meta"); meta.append(el("div", "nm", name)); if (desc) meta.append(el("div", "ds", desc));
    main.append(av, meta, el("div", "chk", "✓"));
    main.addEventListener("click", () => { activeBot = isBot ? name : null; setModelLabel(); closeSheet(); });
    row.append(main);
    if (isBot) {
      const edit = el("button", "edit");
      edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      edit.addEventListener("click", (e) => { e.stopPropagation(); openBotForm(name); });
      row.append(edit);
    }
    return row;
  };
  list.append(mk("Nakata", "Varsayılan", !activeBot, false));
  for (const [name, bot] of Object.entries(bots)) list.append(mk(name, bot.description || bot.model || "", activeBot === name, true));
}
$("#modelBtn").addEventListener("click", openBotSheet);

let editingBot = null;
function openBotForm(name){
  const bots = allBots(); const bot = name ? bots[name] : null;
  editingBot = name || null;
  $("#botFormTitle").textContent = bot ? "Botu düzenle" : "Yeni bot";
  $("#bf-name").value = name || ""; $("#bf-name").readOnly = !!bot;
  $("#bf-model").value = bot?.model || ""; $("#bf-persona").value = bot?.persona || "";
  $("#bf-del").hidden = !bot;
  closeSheet(); $("#f-botform").classList.add("on");
  if (!bot) $("#bf-name").focus();
}
$("#botNew").addEventListener("click", () => openBotForm(null));
$("#botSave").addEventListener("click", () => {
  const name = $("#bf-name").value.trim();
  const persona = $("#bf-persona").value;
  if (!name) return $("#bf-name").focus();
  if (!persona.trim()) return $("#bf-persona").focus();
  const bots = allBots();
  bots[name] = { persona, model: $("#bf-model").value.trim() || undefined };
  saveBots(bots);
  $("#f-botform").classList.remove("on"); openBotSheet();
});
$("#bf-del").addEventListener("click", () => {
  if (!editingBot) return;
  const bots = allBots(); delete bots[editingBot]; saveBots(bots);
  if (activeBot === editingBot) { activeBot = null; setModelLabel(); }
  $("#f-botform").classList.remove("on"); openBotSheet();
});

/* ---- sessions (local) ---- */
function allSessions(){ return LS.get("nakata_byok_sessions", {}); }
function saveSessions(s){ LS.set("nakata_byok_sessions", s); }
function renderSessions(filter = ""){
  const list = $("#slist"); list.replaceChildren();
  const f = filter.trim().toLowerCase();
  let items = Object.values(allSessions()).sort((a, b) => b.ts - a.ts);
  if (f) items = items.filter((s) => (s.title || "").toLowerCase().includes(f));
  if (!items.length) { list.append(el("div", "note", f ? "Eşleşme yok" : "Henüz sohbet yok")); return; }
  list.append(el("div", "sec", "Sohbetler"));
  for (const s of items) {
    const row = el("div", "sitem" + (curId === s.id ? " on" : ""));
    const t = el("button", "st", s.title || "(başlıksız)");
    t.addEventListener("click", () => { closeDrawer(); openConvo(s.id); });
    const x = el("button", "x"); x.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
    x.addEventListener("click", (e) => { e.stopPropagation(); const all = allSessions(); delete all[s.id]; saveSessions(all); if (curId === s.id) newChat(); else renderSessions($("#search").value); });
    row.append(t, x); list.append(row);
  }
}
$("#search").addEventListener("input", (e) => renderSessions(e.target.value));

/* ---- chat ---- */
let convo = [];          // [{role, content}]
let curId = null;
let controller = null, bubble = null, reasonNode = null;

function showHero(on){ $("#hero").hidden = !on; $("#thread").hidden = on; }
function scrollDown(){ const c = $("#chatScroll"); c.scrollTop = c.scrollHeight; }
function addUser(text){ const r = el("div", "row user"); r.append(el("div", "bubble", text)); $("#thread").append(r); scrollDown(); }
function addAsst(){
  const r = el("div", "row"); const w = el("div", "asst");
  const logo = el("div", "logo"); logo.innerHTML = ASST_LOGO;
  const text = el("div", "text"); w.append(logo, text); r.append(w); $("#thread").append(r); scrollDown();
  return text;
}
function addNote(text, err){ const n = el("div", "note" + (err ? " err" : ""), text); $("#thread").append(n); scrollDown(); }

function newChat(){
  convo = []; curId = null; showHero(true); $("#thread").replaceChildren(); closeDrawer();
  renderSessions($("#search").value); $("#prompt").focus();
}
$("#newBtn").addEventListener("click", newChat);
$("#newBtn2").addEventListener("click", newChat);

function renderConvo(){
  $("#thread").replaceChildren();
  for (const m of convo) {
    if (m.role === "user") addUser(m.content);
    else if (m.role === "assistant" && m.content.trim()) addAsst().textContent = m.content;
  }
}
function openConvo(id){
  const s = allSessions()[id]; if (!s) return;
  curId = id; convo = s.msgs.slice(); activeBot = s.bot || null; setModelLabel();
  showHero(convo.length === 0); renderConvo();
}

function persist(){
  if (!convo.length) return;
  if (!curId) curId = "c" + Date.now() + Math.random().toString(36).slice(2, 6);
  const title = (convo.find((m) => m.role === "user")?.content || "Sohbet").split("\n")[0].slice(0, 60);
  const all = allSessions();
  all[curId] = { id: curId, title, ts: Date.now(), bot: activeBot || null, msgs: convo };
  saveSessions(all);
}

function setBusy(on){
  const b = $("#sendBtn");
  b.classList.toggle("stop", on); b.disabled = !on && !$("#prompt").value.trim();
  b.querySelector("svg").innerHTML = on ? '<rect x="7" y="7" width="10" height="10" rx="2.5" fill="currentColor" stroke="none"/>' : '<path d="M12 19V5M5 12l7-7 7 7"/>';
}

async function send(text){
  const cfg = getCfg();
  if (!cfg.key) { openSettings(); return; }
  showHero(false); addUser(text); bubble = null; reasonNode = null; setBusy(true);
  convo.push({ role: "user", content: text });

  const bots = allBots();
  const bot = activeBot ? bots[activeBot] : null;
  const model = (bot && bot.model) || cfg.model;
  const messages = [];
  if (bot && bot.persona) messages.push({ role: "system", content: bot.persona });
  for (const m of convo) if (m.role === "user" || m.role === "assistant") messages.push({ role: m.role, content: m.content });

  controller = new AbortController();
  let acc = "";
  try {
    const res = await fetch(cfg.base.replace(/\/+$/,"") + "/chat/completions", {
      method: "POST", signal: controller.signal,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + cfg.key,
        "HTTP-Referer": "https://nakata.app", "X-Title": "Nakata",
      },
      body: JSON.stringify({ model, stream: true, messages }),
    });
    if (!res.ok || !res.body) {
      const j = await res.json().catch(() => ({}));
      throw new Error((j.error && (j.error.message || j.error)) || `HTTP ${res.status}`);
    }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const raw = buf.slice(0, i); buf = buf.slice(i + 1);
        const line = raw.trim(); if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim(); if (!payload || payload === "[DONE]") continue;
        let ev; try { ev = JSON.parse(payload); } catch { continue; }
        if (ev.error) { addNote("Hata: " + (ev.error.message || ev.error), true); continue; }
        const d = (ev.choices && ev.choices[0] && ev.choices[0].delta) || {};
        if (d.reasoning) { if (!reasonNode) { reasonNode = el("div", "reason"); $("#thread").append(reasonNode); } reasonNode.textContent += d.reasoning; scrollDown(); }
        if (d.content) { if (!bubble) bubble = addAsst(); bubble.textContent += d.content; acc += d.content; scrollDown(); }
      }
    }
    if (!acc && !reasonNode) addNote("Boş yanıt — modeli/anahtarı kontrol et.", true);
  } catch (e) {
    if (e.name !== "AbortError") addNote("Bağlantı: " + e.message, true);
  } finally {
    if (acc) convo.push({ role: "assistant", content: acc });
    else convo.pop(); // başarısız turda kullanıcı mesajını geçmişe yazma
    persist();
    controller = null; setBusy(false);
  }
}

$("#composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (controller) { controller.abort(); return; }
  const text = $("#prompt").value.trim(); if (!text) return;
  $("#prompt").value = ""; grow(); setBusy(false); send(text);
});
function grow(){ const t = $("#prompt"); t.style.height = "auto"; t.style.height = `${Math.min(t.scrollHeight, 150)}px`; }
$("#prompt").addEventListener("input", () => { grow(); if (!controller) $("#sendBtn").disabled = !$("#prompt").value.trim(); });
$("#prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
$("#plusBtn").addEventListener("click", () => openFeature("image"));

/* ---- boot ---- */
setModelLabel();
renderSessions();
grow();
if (!getCfg().key) openSettings();   // ilk açılış: anahtar iste
</script>
</body>
